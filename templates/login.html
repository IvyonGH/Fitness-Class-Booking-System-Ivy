{% extends "base.html" %}
{% block header_title %}{% endblock %}
{% block content %}
<h2 class="title">Log In</h2>
<p class="subtitle">Welcome Back!</p>

<form method="post">
  <div class="field">
    <span class="icon">📞</span>
    <input type="text" name="phone" placeholder="Phone number" value="{{ request.form.get('phone','') }}">
  </div>
  <div class="field">
    <span class="icon">🔒</span>
    <input type="password" name="password" placeholder="Password">
    <span class="toggle">👁</span>
  </div>
  <a href="#" class="forgot">Forgot Password?</a>
  <button type="submit" class="btn">Sign In</button>
</form>

<div class="divider">Log in with</div>
<div class="social-row">
  <div class="soc" title="Phone">

  </div>
  <div class="soc" title="Google">

      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>

<p class="switch-link">Don't have an account? <a href="{{ url_for('register') }}">Register →</a></p>
