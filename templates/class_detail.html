{% extends "base.html" %}
{% block header %}{% endblock %}
{% block content_class %}flush{% endblock %}
{% block content %}
<div class="hero-img cat-{{ cls.slug }}">
  <a href="javascript:history.back()" class="back-btn">‹</a>
</div>
<div class="detail-body">
  <h2>{{ cls.title }}</h2>
  <p>{{ cls.description }}</p>

  <h3>Explore Our Classes</h3>
  {% for other in other_classes %}
    <div class="class-card" style="margin-bottom:10px;">
      <div class="meta"><h4 style="margin:0;">{{ other.title }}</h4></div>
      <a href="{{ url_for('class_detail', slug=other.slug) }}" class="badge badge-orange link">View</a>
    </div>
  {% endfor %}
</div>
{% endblock %}
